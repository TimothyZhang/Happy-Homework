<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- contact shadow -->
  <ellipse cx="60" cy="96" rx="46" ry="4.5" fill="rgba(40,25,8,0.18)"/>

  <!-- === LOW CABINET (3D box) === -->
  <!-- cabinet RIGHT side face (darker) -->
  <path d="M99 78 L106 72 L106 88 L99 94 Z" fill="#9a7848" rx="0"/>
  <!-- cabinet FRONT face (base color) -->
  <rect x="13" y="78" width="86" height="16" rx="3.5" fill="#b08e5e"/>
  <!-- cabinet TOP face (lighter) — parallelogram strip -->
  <path d="M13 78 L20 72 L106 72 L99 78 Z" fill="#e0c193"/>
  <!-- top face front-edge highlight (subtle) -->
  <rect x="13" y="78" width="86" height="5" rx="2.5" fill="#e8cfa8"/>

  <!-- cabinet legs front-left, front-right -->
  <rect x="17" y="91" width="9" height="4" rx="1.5" fill="#9a7848"/>
  <rect x="88" y="91" width="9" height="4" rx="1.5" fill="#9a7848"/>
  <!-- cabinet drawer line -->
  <rect x="48" y="85" width="16" height="2" rx="1" fill="#9a7848"/>
  <rect x="54" y="86" width="2" height="2" rx="1" fill="#c79e68"/>

  <!-- === TV BODY (3D) === -->
  <!-- TV bezel RIGHT side edge (darker, thin) -->
  <path d="M101 22 L108 17 L108 77 L101 82 Z" fill="#1a2530"/>
  <!-- TV bezel FRONT face -->
  <rect x="11" y="22" width="90" height="60" rx="5" fill="#27323f"/>
  <!-- TV bezel TOP thin edge (lighter) -->
  <path d="M11 22 L18 17 L108 17 L101 22 Z" fill="#3a4e5e"/>

  <!-- TV screen inset -->
  <rect x="16" y="27" width="80" height="50" rx="3" fill="#1e2830"/>

  <!-- screen glow / content area -->
  <rect x="19" y="30" width="74" height="44" rx="2" fill="#3a5a6a"/>
  <!-- soft center glow -->
  <rect x="27" y="36" width="58" height="32" rx="2" fill="#4e8a9e"/>
  <!-- inner bright highlight strip (top) -->
  <rect x="27" y="36" width="58" height="8" rx="2" fill="#6fc4d6"/>

  <!-- stand neck -->
  <rect x="52" y="78" width="10" height="6" rx="2" fill="#1e2830"/>

  <!-- power indicator dot -->
  <circle cx="93" cy="71" r="2" fill="#6fc4d6"/>
</svg>
