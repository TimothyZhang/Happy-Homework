<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- contact shadow -->
  <ellipse cx="60" cy="96" rx="46" ry="4.5" fill="rgba(40,25,8,0.18)"/>

  <!-- sofa legs (short, dark teal) -->
  <rect x="22" y="88" width="8" height="7" rx="2" fill="#3d8a87"/>
  <rect x="90" y="88" width="8" height="7" rx="2" fill="#3d8a87"/>

  <!-- sofa base / seat platform -->
  <rect x="14" y="72" width="92" height="22" rx="6" fill="#5bb0ac"/>

  <!-- seat cushions (two, slightly lighter) -->
  <rect x="18" y="68" width="38" height="20" rx="5" fill="#7ec9c5"/>
  <rect x="64" y="68" width="38" height="20" rx="5" fill="#7ec9c5"/>

  <!-- cushion crease lines (subtle darker shade) -->
  <rect x="36" y="70" width="3" height="16" rx="1.5" fill="#5bb0ac"/>
  <rect x="82" y="70" width="3" height="16" rx="1.5" fill="#5bb0ac"/>

  <!-- backrest -->
  <rect x="14" y="48" width="92" height="26" rx="6" fill="#5bb0ac"/>
  <!-- backrest top highlight strip -->
  <rect x="14" y="48" width="92" height="8" rx="6" fill="#6dbfbb"/>

  <!-- left armrest -->
  <rect x="8" y="58" width="18" height="32" rx="6" fill="#4a9e9a"/>
  <!-- left armrest top cap -->
  <rect x="8" y="58" width="18" height="7" rx="5" fill="#6dbfbb"/>

  <!-- right armrest -->
  <rect x="94" y="58" width="18" height="32" rx="6" fill="#4a9e9a"/>
  <!-- right armrest top cap -->
  <rect x="94" y="58" width="18" height="7" rx="5" fill="#6dbfbb"/>

  <!-- throw pillow left (cream) -->
  <rect x="22" y="52" width="22" height="16" rx="5" fill="#fff4e2"/>
  <rect x="32" y="54" width="2" height="12" rx="1" fill="#e8d6be"/>

  <!-- throw pillow right (coral accent) -->
  <rect x="76" y="52" width="22" height="16" rx="5" fill="#e8866b"/>
  <rect x="86" y="54" width="2" height="12" rx="1" fill="#d06e55"/>
</svg>
