<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">

  <!-- contact shadow -->
  <ellipse cx="58" cy="96" rx="46" ry="4.5" fill="rgba(40,25,8,0.18)"/>

  <!-- ===================== LADDER ===================== -->
  <!-- Back rail (far side, darker) -->
  <rect x="37" y="38" width="5" height="52" rx="2.5" fill="#3a7d7a"/>
  <!-- Front rail -->
  <rect x="25" y="38" width="5" height="52" rx="2.5" fill="#4a9e9a"/>
  <!-- Rungs with top-face highlight -->
  <rect x="25" y="43" width="17" height="4" rx="2" fill="#6dbfbb"/>
  <rect x="25" y="43" width="17" height="2" rx="1.5" fill="#8dd4d0"/>
  <rect x="25" y="53" width="17" height="4" rx="2" fill="#6dbfbb"/>
  <rect x="25" y="53" width="17" height="2" rx="1.5" fill="#8dd4d0"/>
  <rect x="25" y="63" width="17" height="4" rx="2" fill="#6dbfbb"/>
  <rect x="25" y="63" width="17" height="2" rx="1.5" fill="#8dd4d0"/>
  <rect x="25" y="73" width="17" height="4" rx="2" fill="#6dbfbb"/>
  <rect x="25" y="73" width="17" height="2" rx="1.5" fill="#8dd4d0"/>
  <rect x="25" y="83" width="17" height="4" rx="2" fill="#6dbfbb"/>
  <rect x="25" y="83" width="17" height="2" rx="1.5" fill="#8dd4d0"/>

  <!-- ===================== SLIDE ===================== -->
  <!-- Slide underbelly / bottom face (darker yellow-amber) -->
  <polygon points="57,29 69,29 91,90 79,90" fill="#c88e00"/>
  <!-- Right side-wall of slide chute (dark teal) -->
  <polygon points="68,28 73,28 95,90 90,90" fill="#2e7470"/>

  <!-- Slide surface top face (bright yellow) -->
  <polygon points="57,29 69,29 89,87 77,87" fill="#f6c643"/>
  <!-- Highlight strip (top-left, lighter) -->
  <polygon points="57,29 63,29 83,87 77,87" fill="#fce07a"/>
  <!-- Right-edge shade on surface -->
  <polygon points="66,29 69,29 89,87 86,87" fill="#e8a800"/>

  <!-- Left teal rail (front face) -->
  <polygon points="52,28 58,28 80,87 74,87" fill="#4a9e9a"/>
  <!-- Left rail side face (darker) -->
  <polygon points="52,28 55,31 77,90 74,87" fill="#3a7d7a"/>

  <!-- ===================== PLATFORM ===================== -->
  <!-- Platform side / bottom face -->
  <rect x="18" y="39" width="56" height="7" rx="3" fill="#3d8a87"/>
  <!-- Platform front face -->
  <rect x="18" y="29" width="56" height="13" rx="4" fill="#5bb0ac"/>
  <!-- Platform top surface (lighter teal) -->
  <rect x="18" y="29" width="56" height="6" rx="3" fill="#7ec9c5"/>

  <!-- ===================== SAFETY RAILS ===================== -->
  <!-- Post side faces (darker) -->
  <rect x="23" y="13" width="2" height="18" rx="1" fill="#c0614e"/>
  <rect x="68" y="13" width="2" height="18" rx="1" fill="#c0614e"/>
  <!-- Post fronts -->
  <rect x="21" y="13" width="4" height="18" rx="2" fill="#e8866b"/>
  <rect x="66" y="13" width="4" height="18" rx="2" fill="#e8866b"/>
  <!-- Horizontal bar underside (darker) -->
  <rect x="21" y="15.5" width="49" height="3" rx="1.5" fill="#c0614e"/>
  <!-- Horizontal bar top face -->
  <rect x="21" y="13" width="49" height="5" rx="2.5" fill="#f0a088"/>

  <!-- ===================== FLAG ===================== -->
  <rect x="22.5" y="3" width="2.5" height="13" rx="1" fill="#e8866b"/>
  <!-- Pennant face -->
  <polygon points="25,3 36,8 25,13" fill="#f6c643"/>
  <!-- Pennant top highlight -->
  <polygon points="25,3 36,8 25,6" fill="#fce07a"/>

  <!-- ===================== GROUND LEGS ===================== -->
  <!-- Leg side faces (darker) -->
  <rect x="31" y="88" width="2" height="8" rx="1" fill="#2e6e6b"/>
  <rect x="88" y="88" width="2" height="8" rx="1" fill="#2e6e6b"/>
  <!-- Leg fronts -->
  <rect x="27" y="88" width="6" height="8" rx="2" fill="#3d8a87"/>
  <rect x="84" y="88" width="6" height="8" rx="2" fill="#3d8a87"/>

  <!-- ===================== BALL ===================== -->
  <!-- Ball shadow bottom -->
  <circle cx="108" cy="91" r="6" fill="#c0614e"/>
  <!-- Ball body -->
  <circle cx="108" cy="90" r="6" fill="#e8866b"/>
  <!-- Teal stripe -->
  <path d="M102.4 90.5 Q108 87.5 113.6 90.5" fill="none" stroke="#4a9e9a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Highlight -->
  <circle cx="105.5" cy="87" r="1.8" fill="#f5b09a"/>

</svg>
