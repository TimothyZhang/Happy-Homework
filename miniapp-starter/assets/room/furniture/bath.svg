<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- contact shadow -->
  <ellipse cx="60" cy="96" rx="40" ry="4.5" fill="rgba(40,25,8,0.18)"/>

  <!-- clawfoot legs (2 visible, front) -->
  <rect x="22" y="85" width="7" height="11" rx="3" fill="#bab2a2"/>
  <rect x="91" y="85" width="7" height="11" rx="3" fill="#bab2a2"/>

  <!-- tub FRONT outer body (base porcelain cream) -->
  <rect x="10" y="60" width="100" height="32" rx="22" fill="#e8e0d2"/>

  <!-- tub FRONT lower shade band (bottom curve darker) -->
  <rect x="10" y="76" width="100" height="16" rx="20" fill="#d4cabb"/>

  <!-- tub TOP rim ellipse: the wide lip seen from above (lighter warm white) -->
  <ellipse cx="60" cy="60" rx="50" ry="9.5" fill="#fff4e2"/>

  <!-- tub inner water surface (seen slightly from above) -->
  <ellipse cx="60" cy="60" rx="38" ry="7" fill="#c4ebf8"/>

  <!-- inner water depth hint (slightly darker band at back of basin) -->
  <ellipse cx="60" cy="56" rx="35" ry="5" fill="#aee0f2"/>

  <!-- water surface main color (front, lighter sky blue) -->
  <ellipse cx="60" cy="61" rx="36" ry="6" fill="#c8edf8"/>

  <!-- foam mounds sitting ON the water ellipse -->
  <ellipse cx="37" cy="58" rx="11" ry="5" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="60" cy="56" rx="14" ry="6" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="83" cy="58" rx="10" ry="5" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="49" cy="59" rx="8" ry="3.8" fill="#ffffff"/>
  <ellipse cx="71" cy="59" rx="8" ry="3.8" fill="#ffffff"/>

  <!-- floating bubbles above -->
  <circle cx="43" cy="48" r="3.5" fill="#ffffff" opacity="0.82"/>
  <circle cx="60" cy="44" r="4.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="76" cy="48" r="2.8" fill="#ffffff" opacity="0.80"/>
  <circle cx="52" cy="41" r="2.2" fill="#ffffff" opacity="0.65"/>

  <!-- faucet on right side -->
  <rect x="91" y="49" width="8" height="5" rx="2" fill="#9aa3b2"/>
  <rect x="93" y="42" width="4" height="9" rx="2" fill="#9aa3b2"/>
  <rect x="89" y="40" width="11" height="4" rx="2" fill="#9aa3b2"/>
  <circle cx="87" cy="42" r="3" fill="#c8c0b0"/>
</svg>
