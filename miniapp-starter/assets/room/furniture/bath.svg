<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- contact shadow -->
  <ellipse cx="60" cy="96" rx="38" ry="4.5" fill="rgba(40,25,8,0.18)"/>

  <!-- clawfoot legs (2 visible feet) -->
  <rect x="23" y="86" width="8" height="9" rx="3.5" fill="#c8c0b0"/>
  <rect x="89" y="86" width="8" height="9" rx="3.5" fill="#c8c0b0"/>

  <!-- tub body outer (porcelain cream) -->
  <rect x="12" y="55" width="96" height="36" rx="20" fill="#e8e0d2"/>

  <!-- tub inner shadow / depth at base -->
  <rect x="12" y="73" width="96" height="18" rx="18" fill="#d4cabb"/>

  <!-- water fill inside tub -->
  <rect x="19" y="63" width="82" height="26" rx="13" fill="#aee0f2"/>

  <!-- tub top rim lip (white porcelain) -->
  <rect x="12" y="53" width="96" height="14" rx="18" fill="#fff4e2"/>

  <!-- foam mounds on water surface -->
  <ellipse cx="34" cy="65" rx="13" ry="7" fill="#ffffff"/>
  <ellipse cx="60" cy="63" rx="16" ry="8.5" fill="#ffffff"/>
  <ellipse cx="86" cy="65" rx="12" ry="7" fill="#ffffff"/>
  <ellipse cx="47" cy="66" rx="9" ry="5.5" fill="#ffffff"/>
  <ellipse cx="73" cy="66" rx="9" ry="5.5" fill="#ffffff"/>

  <!-- floating bubbles above foam -->
  <circle cx="42" cy="53" r="3.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="60" cy="47" r="4.5" fill="#ffffff" opacity="0.78"/>
  <circle cx="76" cy="51" r="2.8" fill="#ffffff" opacity="0.82"/>
  <circle cx="52" cy="43" r="2.2" fill="#ffffff" opacity="0.68"/>
  <circle cx="68" cy="41" r="1.8" fill="#ffffff" opacity="0.62"/>

  <!-- faucet on right side of rim -->
  <rect x="90" y="49" width="8" height="5" rx="2" fill="#9aa3b2"/>
  <rect x="92" y="42" width="4" height="9" rx="2" fill="#9aa3b2"/>
  <rect x="88" y="40" width="11" height="4" rx="2" fill="#9aa3b2"/>
  <circle cx="86" cy="42" r="3" fill="#c8c0b0"/>
</svg>
