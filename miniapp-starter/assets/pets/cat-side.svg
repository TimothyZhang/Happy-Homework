<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="catSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd599"/>
      <stop offset="100%" stop-color="#e89e4a"/>
    </linearGradient>
  </defs>
  <!-- tail -->
  <path d="M50 118 Q22 108 32 76 Q35 64 45 71 Q38 102 64 114 Z" fill="url(#catSide)"/>
  <!-- far legs -->
  <rect x="82" y="138" width="14" height="35" rx="7" fill="#d98e3f"/>
  <rect x="120" y="138" width="14" height="35" rx="7" fill="#d98e3f"/>
  <!-- body -->
  <ellipse cx="104" cy="116" rx="58" ry="40" fill="url(#catSide)"/>
  <!-- near legs -->
  <rect x="72" y="140" width="15" height="34" rx="7.5" fill="url(#catSide)"/>
  <rect x="130" y="140" width="15" height="34" rx="7.5" fill="url(#catSide)"/>
  <!-- head -->
  <circle cx="150" cy="92" r="32" fill="url(#catSide)"/>
  <!-- ears -->
  <path d="M134 66 L137 38 L156 60 Z" fill="url(#catSide)"/>
  <path d="M139 61 L141 48 L150 58 Z" fill="#ffb0c4"/>
  <path d="M160 60 L169 39 L176 65 Z" fill="url(#catSide)"/>
  <path d="M164 58 L169 47 L173 61 Z" fill="#ffb0c4"/>
  <!-- snout + nose -->
  <path d="M176 92 q12 5 9 16 q-9 3 -13 -4 z" fill="url(#catSide)"/>
  <path d="M182 101 l7 2 l-7 4 z" fill="#ff7a96"/>
  <!-- eye -->
  <ellipse cx="159" cy="89" rx="4.8" ry="6.6" fill="#1f2329"/>
  <circle cx="157.5" cy="86.2" r="1.7" fill="#fff"/>
  <!-- whiskers -->
  <path d="M178 106 L199 102 M178 110 L199 113" stroke="#a76b2e" stroke-width="1.2" stroke-linecap="round"/>
  <!-- cheek -->
  <ellipse cx="167" cy="105" rx="6" ry="3.5" fill="#ff8fa5" opacity="0.5"/>
</svg>
