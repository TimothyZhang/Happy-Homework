<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="pigSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcc4d4"/>
      <stop offset="100%" stop-color="#f095af"/>
    </linearGradient>
  </defs>
  <!-- curly tail -->
  <path d="M48 110 q-14 -2 -12 -14 q1 -8 8 -6 q5 2 2 8" stroke="#d97a98" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- far legs -->
  <rect x="82" y="140" width="14" height="33" rx="7" fill="#d97a98"/>
  <rect x="120" y="140" width="14" height="33" rx="7" fill="#d97a98"/>
  <!-- body -->
  <ellipse cx="104" cy="118" rx="60" ry="42" fill="url(#pigSide)"/>
  <!-- near legs -->
  <rect x="72" y="142" width="15" height="33" rx="7.5" fill="url(#pigSide)"/>
  <rect x="130" y="142" width="15" height="33" rx="7.5" fill="url(#pigSide)"/>
  <!-- head -->
  <circle cx="150" cy="94" r="32" fill="url(#pigSide)"/>
  <!-- floppy ear -->
  <path d="M146 70 L132 56 L138 84 Z" fill="#d97a98"/>
  <!-- snout -->
  <ellipse cx="182" cy="100" rx="14" ry="12" fill="#f095af"/>
  <ellipse cx="184" cy="98" rx="3" ry="4" fill="#c2647e"/>
  <ellipse cx="184" cy="106" rx="3" ry="4" fill="#c2647e"/>
  <!-- eye -->
  <ellipse cx="160" cy="90" rx="4.6" ry="6.2" fill="#1f2329"/>
  <circle cx="158.7" cy="87" r="1.6" fill="#fff"/>
  <!-- cheek -->
  <ellipse cx="166" cy="106" rx="6" ry="3.6" fill="#ff5f88" opacity="0.4"/>
</svg>
