<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sheepSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbf2"/>
      <stop offset="100%" stop-color="#f4ecda"/>
    </linearGradient>
  </defs>
  <!-- far legs -->
  <rect x="84" y="140" width="13" height="33" rx="6" fill="#3a3236"/>
  <rect x="120" y="140" width="13" height="33" rx="6" fill="#3a3236"/>
  <!-- fluffy wool body (overlapping bumps) -->
  <circle cx="74" cy="116" r="30" fill="url(#sheepSide)"/>
  <circle cx="104" cy="106" r="32" fill="url(#sheepSide)"/>
  <circle cx="132" cy="116" r="29" fill="url(#sheepSide)"/>
  <circle cx="92" cy="132" r="26" fill="url(#sheepSide)"/>
  <circle cx="120" cy="134" r="24" fill="url(#sheepSide)"/>
  <!-- near legs -->
  <rect x="74" y="142" width="14" height="32" rx="6.5" fill="#3a3236"/>
  <rect x="130" y="142" width="14" height="32" rx="6.5" fill="#3a3236"/>
  <!-- head -->
  <ellipse cx="154" cy="98" rx="24" ry="26" fill="#3a3236"/>
  <!-- ear -->
  <ellipse cx="150" cy="78" rx="12" ry="6" fill="#3a3236" transform="rotate(-32 150 78)"/>
  <!-- wool tuft on forehead -->
  <circle cx="150" cy="80" r="11" fill="url(#sheepSide)"/>
  <!-- eye -->
  <ellipse cx="162" cy="96.5" rx="5.7" ry="7.6" fill="#1f2329"/>
  <circle cx="160" cy="92.8" r="2.5" fill="#fff"/><circle cx="164.2" cy="99" r="1.2" fill="#fff" opacity="0.85"/>
  <!-- nose -->
  <ellipse cx="174" cy="104" rx="5" ry="4" fill="#2a2327"/>
  <!-- cheek -->
  <ellipse cx="166" cy="108" rx="5" ry="3" fill="#ff8fa5" opacity="0.4"/>
</svg>
