<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="dogSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d4a3"/>
      <stop offset="100%" stop-color="#c08d4d"/>
    </linearGradient>
  </defs>
  <!-- tail -->
  <path d="M48 112 Q22 96 30 70 Q34 60 43 67 Q40 96 62 110 Z" fill="url(#dogSide)"/>
  <!-- far legs -->
  <rect x="82" y="138" width="14" height="35" rx="7" fill="#9a6f37"/>
  <rect x="120" y="138" width="14" height="35" rx="7" fill="#9a6f37"/>
  <!-- body -->
  <ellipse cx="104" cy="116" rx="59" ry="41" fill="url(#dogSide)"/>
  <!-- near legs -->
  <rect x="72" y="140" width="15" height="34" rx="7.5" fill="url(#dogSide)"/>
  <rect x="130" y="140" width="15" height="34" rx="7.5" fill="url(#dogSide)"/>
  <!-- head -->
  <circle cx="150" cy="94" r="32" fill="url(#dogSide)"/>
  <!-- floppy ear -->
  <path d="M150 70 Q132 66 130 96 Q130 116 144 110 Q142 86 158 76 Z" fill="#9a6f37"/>
  <!-- muzzle -->
  <ellipse cx="179" cy="104" rx="16" ry="13" fill="#f4d4a3"/>
  <ellipse cx="190" cy="103" rx="6" ry="5" fill="#1f2329"/>
  <!-- mouth -->
  <path d="M182 112 Q186 118 192 114" stroke="#9a6f37" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- eye -->
  <ellipse cx="160" cy="90" rx="4.8" ry="6.4" fill="#1f2329"/>
  <circle cx="158.6" cy="87.4" r="1.7" fill="#fff"/>
  <!-- cheek -->
  <ellipse cx="167" cy="106" rx="6" ry="3.5" fill="#ff8fa5" opacity="0.45"/>
</svg>
